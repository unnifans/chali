<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
      <meta name="description" content="Admin panel for The Malayalam Joke App" />
  <title>Admin - The Malayalam Joke App</title>
  <!-- PWA Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/admin/admin.css" />
</head>
<body>
  <div id="login-view">
    <form id="login-form" class="admin-card">
      <h1>Admin Login</h1>
      <input type="email" id="email" placeholder="Email" required autocomplete="username" />
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" class="btn-accent">Sign In</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="dashboard-view" class="hidden">
    <header class="admin-header">
      <div class="brand">
        <h1>Chali Mod Console</h1>
        <span id="review-position" class="brand-sub">—</span>
      </div>
      <div class="header-actions">
        <input id="search-input" type="search" placeholder="Search jokes…  ( / )" autocomplete="off" />
        <div class="mode-switch" id="mode-switch">
          <button id="mode-review" class="mode-btn active">Review</button>
          <button id="mode-list" class="mode-btn">List</button>
        </div>
        <button id="new-joke-btn" class="btn-accent">+ New</button>
        <button id="logout-btn">Log out</button>
      </div>
    </header>

    <div class="stats-row" id="stats-row">
      <button class="stat-card" data-status="quarantine" title="Click to filter">
        <span class="stat-value" id="stat-quarantine">-</span>
        <span class="stat-label">To Review</span>
      </button>
      <button class="stat-card" data-status="active" title="Click to filter">
        <span class="stat-value" id="stat-active">-</span>
        <span class="stat-label">Active</span>
      </button>
      <button class="stat-card" data-status="deleted" title="Click to filter">
        <span class="stat-value" id="stat-deleted">-</span>
        <span class="stat-label">Deleted</span>
      </button>
      <button class="stat-card" data-status="all" title="Click to filter">
        <span class="stat-value" id="stat-total">-</span>
        <span class="stat-label">Total</span>
      </button>
    </div>

    <div class="filter-pills" id="filter-pills">
      <button class="pill active" data-status="quarantine">Quarantine</button>
      <button class="pill" data-status="active">Active</button>
      <button class="pill" data-status="deleted">Deleted</button>
      <button class="pill" data-status="all">All</button>
    </div>

    <!-- REVIEW MODE -->
    <section id="review-panel" class="hidden">
      <div class="review-toolbar">
        <div class="progress"><div id="review-progress" class="progress-bar"></div></div>
        <span id="review-queue-label">Loading…</span>
      </div>
      <div id="review-card" class="review-card">
        <p class="review-empty">Nothing to review here. Nice!</p>
      </div>
      <div class="review-actions">
        <button id="review-skip" class="act-skip show-key" data-key="→">Skip</button>
        <button id="review-approve" class="act-approve show-key" data-key="A">Approve</button>
        <button id="review-delete" class="act-delete show-key" data-key="D">Delete</button>
        <button id="review-edit" class="act-edit show-key" data-key="E">Edit</button>
      </div>
      <p class="review-help">
        <span>A</span> Approve · <span>D</span> Delete · <span>E</span> Edit ·
        <span>→</span> Skip · <span>Ctrl+Z</span> Undo
      </p>
    </section>

    <!-- LIST MODE -->
    <section id="list-panel">
      <div id="bulk-bar" class="bulk-bar hidden">
        <label class="bulk-select">
          <input type="checkbox" id="select-all-check" />
          <span>Select all</span>
        </label>
        <span id="bulk-count" class="bulk-count">0 selected</span>
        <div class="bulk-actions">
          <button id="bulk-approve-btn" class="btn-approve" disabled>Approve (0)</button>
          <button id="bulk-delete-btn" class="btn-delete" disabled>Delete (0)</button>
        </div>
      </div>
      <div id="queue-root" class="list-root">
        <p>Loading…</p>
      </div>
      <div class="list-nav">
        <button id="prev-page" disabled>← Prev</button>
        <span id="page-info"></span>
        <button id="next-page" disabled>Next →</button>
      </div>
    </section>

    <!-- Create / Edit modal -->
    <div id="edit-modal" class="modal hidden">
      <form id="joke-form" class="admin-card joke-form">
        <div class="modal-head">
          <h2 id="joke-form-title">New Joke</h2>
          <button type="button" id="joke-form-cancel" class="modal-x" aria-label="Close">×</button>
        </div>
        <input type="hidden" id="joke-form-id" />

        <label>Type</label>
        <select id="joke-form-type">
          <option value="single">Single Joke</option>
          <option value="qna">Question &amp; Answer</option>
        </select>

        <label>Question / Joke text</label>
        <textarea id="joke-form-question" maxlength="1000" required></textarea>

        <label id="joke-form-answer-label" class="hidden">Answer</label>
        <textarea id="joke-form-answer" class="hidden" maxlength="1000"></textarea>

        <label>Status</label>
        <select id="joke-form-status">
          <option value="active">active</option>
          <option value="quarantine">quarantine</option>
          <option value="deleted">deleted</option>
        </select>

        <label>Replace image (optional)</label>
        <input type="file" id="joke-form-image" accept="image/png,image/jpeg,image/webp" />

        <div class="joke-form-actions">
          <button type="submit" class="btn-accent">Save</button>
          <button type="button" id="joke-form-cancel-btn" class="btn-ghost">Cancel</button>
        </div>
        <p id="joke-form-status-msg"></p>
      </form>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
