<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Malayalam Joke App</title>
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Feed view -->
    <div id="feed-view">
      <div class="feed-label">Chali</div>
      <div class="card joke-card">
        <div id="joke-root">
          <p class="empty-state">Loading a chali...</p>
        </div>

        <div class="vote-pill">
          <button id="upvote-btn" class="vote-btn vote-btn-up" aria-label="Mass Joke"><span class="vote-emoji">🤣</span> <span class="vote-label">Kollaam</span></button>
          <span id="vote-score" class="vote-score">+0</span>
          <button id="downvote-btn" class="vote-btn vote-btn-down" aria-label="Chali Joke"><span class="vote-emoji">😡</span> <span class="vote-label">Enthonnedey</span></button>
        </div>

        <button id="next-btn" class="next-btn">Next Joke <span class="arrow">→</span></button>

        <button id="show-submit-btn" class="submit-toggle-btn" type="button">
          <span class="submit-toggle-icon">✎</span> Got a chali? <u>Submit one</u>
        </button>
      </div>
    </div>

    <!-- Submit view -->
    <div id="submit-view" class="card submit-card hidden">
      <div class="submit-header">
        <button id="submit-back-btn" type="button" class="back-btn">←</button>
        <h2>Submit</h2>
      </div>

      <div class="notice-banner">
        <span class="notice-dot"></span>
        Keep it short, punchy, and uniquely Malayali! No spamming, only quality chalis allowed.
      </div>

      <form id="submit-form">
        <label class="field-label">Joke Type</label>
        <div class="segmented" id="type-segmented">
          <button type="button" class="segment active" data-type="single">Statement</button>
          <button type="button" class="segment" data-type="qna">Question &amp; Answer</button>
        </div>
        <input type="hidden" id="joke-type" value="single" />

        <label class="field-label">Your Chali</label>
        <textarea id="joke-question" placeholder="Type your chali..." required maxlength="500"></textarea>
        <span class="char-count" id="question-count">0 / 500</span>

        <textarea id="joke-answer" class="hidden" placeholder="Answer..." maxlength="500"></textarea>
        <span class="char-count hidden" id="answer-count">0 / 500</span>

        <label class="field-label">Add Visuals (optional)</label>
        <label for="joke-image" class="dropzone" id="dropzone">
          <span class="dropzone-icon">🖼️</span>
          <span class="dropzone-text">Tap to upload a meme or reaction image</span>
          <img id="joke-image-preview" class="hidden" alt="preview" />
        </label>
        <input type="file" id="joke-image" accept="image/png,image/jpeg,image/webp" class="hidden-input" />

        <button type="submit" class="btn-submit-chali">➤ Submit Chali</button>
        <button type="button" id="submit-cancel-btn" class="btn-cancel">Cancel</button>
        <p id="submit-status"></p>
      </form>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
